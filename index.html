<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoveLetter – Create Your Love Story</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Hind+Siliguri:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#fff4f4;--bg2:#ffd9e2;--ink:#4a1d2c;--mut:#8b5a6a;--glass:rgba(255,255,255,.62);--bd:rgba(225,29,72,.18);--ac:#e11d48;--fld:rgba(255,255,255,.85);--sh:0 24px 60px -24px rgba(225,29,72,.4);--blob:rgba(251,113,133,.35);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0610;--bg2:#2a0f2e;--ink:#fde8ef;--mut:#c9a0b3;--glass:rgba(38,15,44,.55);--bd:rgba(251,113,133,.28);--ac:#fb7185;--fld:rgba(18,7,24,.75);--sh:0 24px 60px -24px rgba(251,113,133,.35);--blob:rgba(168,85,247,.32);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0610;--bg2:#2a0f2e;--ink:#fde8ef;--mut:#c9a0b3;--glass:rgba(38,15,44,.55);--bd:rgba(251,113,133,.28);--ac:#fb7185;--fld:rgba(18,7,24,.75);--sh:0 24px 60px -24px rgba(251,113,133,.35);--blob:rgba(168,85,247,.32);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2)) fixed;color:var(--ink);font-family:'Hind Siliguri','Playfair Display',system-ui,sans-serif;transition:background .4s,color .4s;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.serif{font-family:'Playfair Display','Hind Siliguri',serif}
.blob{position:fixed;width:46vmax;height:46vmax;border-radius:50%;background:var(--blob);filter:blur(90px);pointer-events:none;z-index:0}
.rise{position:fixed;bottom:-40px;color:var(--ac);opacity:0;pointer-events:none;z-index:0;animation:rise 14s linear infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.45}100%{transform:translateY(-110vh) scale(1.2);opacity:0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes flo{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.beat{animation:beat 1.2s ease-in-out infinite}.flo{animation:flo 4s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.rise,.beat,.flo{animation:none}}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.glass{background:var(--glass);border:1px solid var(--bd);border-radius:26px;box-shadow:var(--sh);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.fld{width:100%;background:var(--fld);border:1px solid var(--bd);border-radius:14px;padding:.7rem .9rem;color:var(--ink);outline:none;transition:.2s;font:inherit}
.fld:focus{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 20%,transparent)}
.lbl{display:block;font-size:.85rem;font-weight:600;margin:0 0 .35rem;color:var(--mut)}.err{color:#e11d48;font-size:.78rem;margin-top:.3rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;cursor:pointer;font:inherit;font-weight:600;border-radius:999px;transition:.25s}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,#fb7185,#be123c);color:#fff;padding:.9rem 1.7rem;box-shadow:0 14px 30px -10px rgba(225,29,72,.7)}
.btn-p:not(:disabled):hover{transform:translateY(-2px) scale(1.03)}
.btn-g{background:var(--fld);color:var(--ink);border:1px solid var(--bd);padding:.55rem 1rem;font-size:.88rem}
.btn-g:not(:disabled):hover{border-color:var(--ac);color:var(--ac);transform:translateY(-1px)}
.seg{display:inline-flex;background:var(--fld);border:1px solid var(--bd);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mut);padding:.4rem 1rem;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;transition:.25s}
.seg button.on{background:linear-gradient(135deg,#fb7185,#be123c);color:#fff}
.paper{position:relative;width:100%;max-width:600px;margin:0 auto;padding:34px 30px 26px;border-radius:20px;color:#4a1d2c;background:linear-gradient(170deg,#fffaf6,#fff0ee 70%,#ffe6e8);border:1px solid #f3c4cb;box-shadow:0 30px 60px -25px rgba(190,18,60,.45);overflow:hidden}
.paper::before{content:"";position:absolute;inset:10px;border:1px dashed #f0a3b2;border-radius:14px;pointer-events:none}
.paper p{margin:0 0 .95em;line-height:1.85;font-size:1.02rem;text-align:left}
.polaroid{background:#fff;padding:9px 9px 30px;border-radius:4px;box-shadow:0 10px 25px -8px rgba(0,0,0,.3);transform:rotate(-2.5deg);width:min(260px,70%);margin:0 auto}
.drop{display:flex;align-items:center;gap:.8rem;border:2px dashed var(--bd);border-radius:16px;padding:.9rem;cursor:pointer;transition:.2s;background:var(--fld)}.drop:hover{border-color:var(--ac)}
.grad{background:linear-gradient(120deg,#fb7185,#e11d48 45%,#a21caf);-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:999px;font-size:.9rem;box-shadow:0 10px 30px rgba(0,0,0,.3)}
</style>
</head>
<body>
<div id="root"></div>
<script>
const {useState,useEffect,useRef}=React;
const html=htm.bind(React.createElement);
const PORTFOLIO_URL=''; // add a portfolio / social link here to make the developer name clickable
const P={heart:'M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z',sun:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8ZM12 2v2M12 20v2m-7.07-2.93 1.41-1.41m11.32-11.32 1.41-1.41M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41',moon:'M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z',download:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',upload:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12',refresh:'M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16M8 16H3v5',reset:'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5',pencil:'M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z',x:'M18 6 6 18M6 6l12 12',check:'M20 6 9 17l-5-5'};
const Icon=({n,s=18,fill,style,className})=>html`<svg viewBox="0 0 24 24" width=${s} height=${s} fill=${fill||'none'} stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style=${style} className=${className}><path d=${P[n]}/></svg>`;

const bn=s=>String(s).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const parse=v=>v?new Date(v+'T00:00:00'):null;
const diff=(a,now)=>{if(!a)return null;const ms=now-a;if(ms<0)return null;return{d:Math.floor(ms/864e5),h:Math.floor(ms/36e5)%24,m:Math.floor(ms/6e4)%60,s:Math.floor(ms/1e3)%60}};
const rnd=n=>Math.floor(Math.random()*n);
const todayStr=()=>{const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')};

const EN={sign:'Forever yours,',title:'Our Love Story',unit:'days together',
o:[v=>`My dearest ${v.n},`,v=>`Dear ${v.n}, my love,`,v=>`To my beautiful ${v.n},`],
a:[v=>`As I sit down to write this, I realize it has been ${v.dd} since you walked into my life, and somehow every single one of them feels like a gift. I never knew an ordinary day could feel this warm until I started sharing them with you.`,
v=>`${v.dd}. I have counted them not because I have to, but because every one carries your smile, your voice, and the quiet way you make everything better. Time moves differently when I am with you, ${v.n}.`,
v=>`It has been ${v.dd} since our story began, and I still catch myself smiling at the thought of you. You turned my ordinary world into something I never want to leave.`],
b:[v=>`You have a way of making hard days feel lighter and good days feel unforgettable. In your laughter I have found my favourite sound, and in your eyes, a place that feels like home.`,
v=>`Thank you for your patience, your kindness, and for loving me even on the days I am hard to love. With you, I feel understood in a way words can barely explain.`,
v=>`I love the little things most: the way you laugh at your own jokes, the messages that make my day, the comfort of knowing you are there. Those small moments are the ones I will treasure forever.`],
p:v=>`There is something I have always wanted to tell you: “${v.msg}”`,
c:[v=>`Whatever tomorrow brings, I want to face it holding your hand. I promise to keep choosing you, every single day.`,
v=>`I do not know what the future holds, but I know I want you in every part of it. You are my today, my tomorrow, and my always.`,
v=>`Here is to every sunrise and every quiet evening still waiting for us. I love you more than these words could ever say.`]};
const BN={sign:'সারাজীবন তোমার,',title:'আমাদের ভালোবাসার গল্প',unit:'দিন একসাথে',
o:[v=>`প্রিয় ${v.n},`,v=>`আমার ভালোবাসা ${v.n},`,v=>`আমার প্রিয়তমা ${v.n},`],
a:[v=>`এই চিঠিটা লিখতে বসে হঠাৎ খেয়াল করলাম, তুমি আমার জীবনে আসার পর ${v.dd} পেরিয়ে গেছে। অথচ প্রতিটা দিনই যেন একটা উপহার। তোমার সাথে ভাগ করে নেওয়ার পর থেকে সাধারণ দিনগুলোও কত সুন্দর হয়ে উঠেছে, তা তুমি হয়তো জানো না।`,
v=>`${v.dd}। এই দিনগুলো আমি গুনে রাখি বাধ্য হয়ে নয়, ভালোবেসে। কারণ প্রতিটি দিনে আছে তোমার হাসি, তোমার কণ্ঠ আর তোমার নীরব যত্ন। তুমি পাশে থাকলে সময় যেন অন্যরকম হয়ে যায়, ${v.n}।`,
v=>`আমাদের গল্পের ${v.dd} পার হয়ে গেছে, তবুও তোমার কথা ভাবলে আজও নিজের অজান্তেই হেসে ফেলি। তুমি আমার সাদামাটা পৃথিবীটাকে এমন এক জায়গা বানিয়ে দিয়েছো যেখান থেকে আমি আর কোথাও যেতে চাই না।`],
b:[v=>`কঠিন দিনগুলোকে তুমি হালকা করে দাও, আর ভালো দিনগুলোকে করে তোলো অবিস্মরণীয়। তোমার হাসিই আমার সবচেয়ে প্রিয় শব্দ, আর তোমার চোখে আমি খুঁজে পাই আমার ঘর।`,
v=>`তোমার ধৈর্য, তোমার মায়া, আর আমার সবচেয়ে খারাপ সময়েও আমাকে ভালোবেসে যাওয়ার জন্য ধন্যবাদ। তোমার কাছে আমি এমনভাবে বোঝা পড়ি, যা ভাষায় প্রকাশ করা কঠিন।`,
v=>`ছোট ছোট জিনিসগুলোই আমার সবচেয়ে প্রিয়: নিজের কথায় তোমার হেসে ওঠা, দিন ভালো করে দেওয়া তোমার মেসেজ, আর তুমি আছো জেনে মনের শান্তি। এই ছোট মুহূর্তগুলোই আমি সারাজীবন আগলে রাখব।`],
p:v=>`আজ তোমাকে মনের একটা কথা বলতে চাই: “${v.msg}”`,
c:[v=>`আগামীকাল যা-ই আসুক, আমি তোমার হাত ধরে তার মুখোমুখি হতে চাই। আমি কথা দিচ্ছি, প্রতিদিন নতুন করে তোমাকেই বেছে নেব।`,
v=>`ভবিষ্যৎ কী নিয়ে আসবে জানি না, তবে জানি তার প্রতিটি অংশে আমি তোমাকে চাই। তুমি আমার আজ, আমার আগামী, আমার চিরকালের ভালোবাসা।`,
v=>`সামনে যত ভোর আর শান্ত সন্ধ্যা অপেক্ষা করছে, সবটুকু তোমার সাথে কাটাতে চাই। কথায় যতটা বলা যায়, তার চেয়েও অনেক বেশি ভালোবাসি তোমাকে।`]};
const build=(L,i,v)=>[L.o[i[0]](v),L.a[i[1]](v),L.b[i[2]](v),v.msg&&L.p(v),L.c[i[3]](v)].filter(Boolean).join('\n\n');
const make=(i,f,d)=>({idx:i,
 en:build(EN,i,{n:f.her.trim(),msg:f.msg.trim(),dd:d===1?'1 day':d+' days'}),
 bn:build(BN,i,{n:f.her.trim(),msg:f.msg.trim(),dd:bn(d)+' দিন'})});

const Field=({label,error,children})=>html`<div><label className="lbl">${label}</label>${children}${error&&html`<div className="err">${error}</div>`}</div>`;

const LetterCard=({cardRef,lang,text,editing,onText,f,photo,el})=>{
 const L=lang==='bn'?BN:EN,num=x=>lang==='bn'?bn(x):x;
 const ff=lang==='bn'?"'Hind Siliguri',sans-serif":"'Playfair Display',Georgia,serif";
 return html`<div ref=${cardRef} className="paper" style=${{fontFamily:ff}}>
  <${Icon} n="heart" s=${22} fill="#fb7185" className="flo" style=${{position:'absolute',top:22,left:24,color:'#fb7185',opacity:.7}}/>
  <${Icon} n="heart" s=${16} fill="#f9a8b8" className="flo" style=${{position:'absolute',top:34,right:34,color:'#f9a8b8',opacity:.8}}/>
  <${Icon} n="heart" s=${14} fill="#fda4af" style=${{position:'absolute',bottom:30,left:34,color:'#fda4af',opacity:.7}}/>
  <div style=${{textAlign:'center',position:'relative'}}>
   <div style=${{fontSize:'.72rem',color:'#be123c',fontWeight:600}}>${lang==='bn'?'ভালোবাসার চিঠি':'A LOVE LETTER'}</div>
   <div style=${{fontFamily:lang==='bn'?ff:"'Dancing Script',cursive",fontSize:'2rem',fontWeight:700,color:'#be123c',lineHeight:1.3,margin:'4px 0 14px'}}>${L.title}</div>
   ${photo&&html`<div className="polaroid"><div style=${{aspectRatio:'1/1',borderRadius:2,backgroundImage:`url(${photo})`,backgroundSize:'cover',backgroundPosition:'center'}}></div></div>`}
   ${el&&html`<div style=${{margin:'22px auto 6px',position:'relative',width:112,height:104}}>
     <${Icon} n="heart" s=${112} fill="#e11d48" style=${{color:'#e11d48',position:'absolute',inset:0,margin:'auto'}}/>
     <div style=${{position:'absolute',inset:'0 0 8px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',color:'#fff'}}>
      <div style=${{fontSize:'1.7rem',fontWeight:700,lineHeight:1}}>${num(el.d)}</div>
      <div style=${{fontSize:'.62rem',marginTop:2}}>${lang==='bn'?'দিন':'days'}</div></div></div>
    <div style=${{fontSize:'.8rem',color:'#9f4a5f'}}>${L.unit} · ${num(el.h)}${lang==='bn'?' ঘণ্টা ':'h '}${num(el.m)}${lang==='bn'?' মিনিট ':'m '}${num(el.s)}${lang==='bn'?' সেকেন্ড':'s'}</div>`}
  </div>
  <div style=${{margin:'22px 0 8px',position:'relative'}}>
   ${editing?html`<textarea className="fld" value=${text} onChange=${e=>onText(e.target.value)} rows="16" style=${{fontFamily:ff,lineHeight:1.7,background:'#fff',color:'#4a1d2c'}}/>`
   :text.split('\n\n').map((t,i)=>html`<p key=${i} style=${{fontWeight:i===0?600:400,fontSize:i===0?'1.15rem':undefined}}>${t}</p>`)}
  </div>
  <div style=${{textAlign:'right',position:'relative',marginTop:10}}>
   <div style=${{fontSize:'.95rem',color:'#9f4a5f'}}>${L.sign}</div>
   <div style=${{fontFamily:"'Dancing Script','Hind Siliguri',cursive",fontSize:'2rem',color:'#be123c',lineHeight:1.4}}>${f.me.trim()}</div>
  </div>
  <div style=${{textAlign:'center',fontSize:'.68rem',color:'#c27a8c',marginTop:14}}>♥ LoveLetter ♥</div>
 </div>`;
};

function App(){
 const [theme,setTheme]=useState(()=>{try{const t=localStorage.getItem('ll-theme');if(t)return t}catch(e){}return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'});
 const [f,setF]=useState({me:'',her:'',date:'',msg:'',lang:'bn'});
 const [photo,setPhoto]=useState(null),[err,setErr]=useState({}),[letter,setLetter]=useState(null);
 const [tab,setTab]=useState('bn'),[busy,setBusy]=useState(false),[editing,setEditing]=useState(false),[exp,setExp]=useState(false);
 const [now,setNow]=useState(Date.now()),[toast,setToast]=useState('');
 const card=useRef(),prev=useRef(),file=useRef();
 useEffect(()=>{document.documentElement.dataset.theme=theme;try{localStorage.setItem('ll-theme',theme)}catch(e){}},[theme]);
 useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t)},[]);
 useEffect(()=>{if(!toast)return;const t=setTimeout(()=>setToast(''),2800);return()=>clearTimeout(t)},[toast]);
 const el=diff(parse(f.date),now);
 const set=k=>e=>setF({...f,[k]:e.target.value});
 const goCreate=()=>document.getElementById('create').scrollIntoView({behavior:'smooth'});
 const pick=x=>{if(!x)return;if(!x.type.startsWith('image/'))return setErr({...err,photo:'Please choose an image file (JPG, PNG, WebP).'});
  if(x.size>10*1024*1024)return setErr({...err,photo:'Image is too large. Please keep it under 10 MB.'});
  const r=new FileReader();r.onload=()=>{setPhoto(r.result);setErr(e=>({...e,photo:null}))};r.readAsDataURL(x)};
 const generate=()=>{const e={};
  if(!f.me.trim())e.me='Please enter your name.';if(!f.her.trim())e.her='Please enter her name.';
  if(!f.date)e.date='Pick the day your story began.';else if(!el)e.date='The date cannot be in the future.';
  setErr(e);if(Object.keys(e).length)return;
  setBusy(true);setEditing(false);
  setTimeout(()=>{setLetter(make([rnd(3),rnd(3),rnd(3),rnd(3)],f,el.d));setTab(f.lang);setBusy(false);
   setTimeout(()=>prev.current&&prev.current.scrollIntoView({behavior:'smooth',block:'start'}),80)},1700)};
 const regen=()=>{setBusy(true);setEditing(false);setTimeout(()=>{setLetter(make(letter.idx.map(i=>(i+1+rnd(2))%3),f,el?el.d:0));setBusy(false);setToast('Fresh wording written ❤️')},1100)};
 const reset=()=>{setF({me:'',her:'',date:'',msg:'',lang:'bn'});setPhoto(null);setErr({});setLetter(null);setEditing(false);goCreate()};
 const save=async()=>{setExp(true);
  try{await document.fonts.ready;
   await Promise.all(['"Hind Siliguri"','"Playfair Display"','"Dancing Script"'].map(n=>document.fonts.load('500 18px '+n,'Aa অআ ♥')));
   const node=card.current,scale=Math.min(4,Math.max(2,1600/node.offsetWidth));
   const cv=await html2canvas(node,{scale,backgroundColor:'#fff4f2',useCORS:true,logging:false});
   const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.95));
   const name='love-letter-'+(tab==='en'?f.her.trim().replace(/\s+/g,'-'):'bangla')+'.jpg';
   const dl=window.claude&&await window.claude.use('downloads');
   if(dl){await dl.save({filename:name,data:blob});setToast('Your love letter is ready ❤️')}
   else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setToast('Downloaded ❤️')}
  }catch(e){if(!e||e.code!=='declined')setToast('Could not create the image. Please try again.')}
  setExp(false)};
 const text=letter?letter[tab]:'';
 const hearts=[6,18,30,44,57,70,82,93];
 return html`<div>
  <div className="blob" style=${{top:'-15vmax',left:'-12vmax'}}></div><div className="blob" style=${{bottom:'-18vmax',right:'-14vmax'}}></div>
  ${hearts.map((l,i)=>html`<span key=${i} className="rise" style=${{left:l+'%',animationDelay:(i*1.7)+'s',animationDuration:(11+i%4*2)+'s'}}><${Icon} n="heart" s=${14+i%3*8} fill="currentColor"/></span>`)}
  <header className="hdr"><div className="flex items-center justify-between mx-auto px-4 py-3" style=${{maxWidth:1100}}>
   <div className="flex items-center gap-2 serif" style=${{fontWeight:700,fontSize:'1.2rem'}}><${Icon} n="heart" s=${22} fill="currentColor" className="beat" style=${{color:'var(--ac)'}}/>LoveLetter</div>
   <div className="flex items-center gap-2">
    <button className="btn btn-g" onClick=${goCreate}>Create</button>
    <button className="btn btn-g" aria-label="Toggle theme" onClick=${()=>setTheme(theme==='dark'?'light':'dark')} style=${{padding:'.55rem'}}><${Icon} n=${theme==='dark'?'sun':'moon'}/></button>
   </div></div></header>

  <main style=${{position:'relative',zIndex:1}}>
   <section className="text-center mx-auto px-5 pt-16 pb-12" style=${{maxWidth:820}}>
    <div className="beat" style=${{display:'inline-block',color:'var(--ac)',marginBottom:12}}><${Icon} n="heart" s=${54} fill="currentColor"/></div>
    <h1 className="serif grad" style=${{fontSize:'clamp(2.1rem,6vw,3.8rem)',fontWeight:700,lineHeight:1.15,margin:0}}>Turn Your Feelings Into a Beautiful Love Letter ❤️</h1>
    <p style=${{fontSize:'1.2rem',color:'var(--mut)',margin:'18px 0 28px'}}>Every love story deserves words worth remembering.</p>
    <button className="btn btn-p" style=${{fontSize:'1.05rem'}} onClick=${goCreate}>Create Your Love Letter</button>
    <div className="flex flex-wrap justify-center gap-2 mt-6">${['বাংলা & English','HD JPG download','Light & dark mode'].map(t=>html`<span key=${t} className="glass" style=${{padding:'.3rem .9rem',borderRadius:999,fontSize:'.85rem',boxShadow:'none'}}>${t}</span>`)}</div>
   </section>

   <section id="create" className="mx-auto px-4 pb-16 grid lg:grid-cols-5 gap-8 items-start" style=${{maxWidth:1100}}>
    <div className="glass lg:col-span-2 p-6" style=${{display:'grid',gap:16}}>
     <h2 className="serif" style=${{fontSize:'1.5rem',margin:0}}>Write your story</h2>
     <${Field} label="Your name" error=${err.me}><input className="fld" value=${f.me} onChange=${set('me')} placeholder=""/><//>
     <${Field} label="Her name" error=${err.her}><input className="fld" value=${f.her} onChange=${set('her')} placeholder=""/><//>
     <${Field} label="Relationship start date" error=${err.date}><input type="date" className="fld" max=${todayStr()} value=${f.date} onChange=${set('date')}/><//>
     <${Field} label="Days together (automatic)"><div className="fld flex items-center gap-2" style=${{fontWeight:600}}><${Icon} n="heart" s=${16} fill="currentColor" style=${{color:'var(--ac)'}}/>${el?html`${el.d} days · ${el.h}h ${el.m}m ${el.s}s`:html`<span style=${{color:'var(--mut)',fontWeight:400}}>Pick a start date</span>`}</div><//>
     <${Field} label="Special message / feelings (optional)"><textarea className="fld" rows="4" value=${f.msg} onChange=${set('msg')} placeholder="Something only you two know…" maxLength="400"/><//>
     <${Field} label="Letter language"><div className="seg">${[['bn','বাংলা'],['en','English']].map(([k,t])=>html`<button key=${k} className=${f.lang===k?'on':''} onClick=${()=>setF({...f,lang:k})}>${t}</button>`)}</div><//>
     <${Field} label="Couple photo (optional)" error=${err.photo}>
      <input ref=${file} type="file" accept="image/*" hidden onChange=${e=>{pick(e.target.files[0]);e.target.value=''}}/>
      ${photo?html`<div className="flex items-center gap-3"><img src=${photo} alt="Preview" style=${{width:72,height:72,objectFit:'cover',borderRadius:14,border:'1px solid var(--bd)'}}/>
        <button className="btn btn-g" onClick=${()=>file.current.click()}><${Icon} n="upload" s=${15}/>Change</button>
        <button className="btn btn-g" onClick=${()=>setPhoto(null)}><${Icon} n="x" s=${15}/>Remove</button></div>`
      :html`<div className="drop" onClick=${()=>file.current.click()} onDragOver=${e=>e.preventDefault()} onDrop=${e=>{e.preventDefault();pick(e.dataTransfer.files[0])}}><${Icon} n="upload" s=${22} style=${{color:'var(--ac)'}}/><span style=${{color:'var(--mut)',fontSize:'.9rem'}}>Tap to upload or drop a photo here</span></div>`}<//>
     <button className="btn btn-p" disabled=${busy} onClick=${generate}>Generate My Love Letter ❤️</button>
     <button className="btn btn-g" onClick=${reset}><${Icon} n="reset" s=${15}/>Reset & start over</button>
    </div>

    <div className="lg:col-span-3" ref=${prev}>
     <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
      <div className="seg">${[['bn','বাংলা'],['en','English']].map(([k,t])=>html`<button key=${k} className=${tab===k?'on':''} disabled=${!letter} onClick=${()=>setTab(k)}>${t}</button>`)}</div>
      <div className="flex flex-wrap gap-2">
       <button className="btn btn-g" disabled=${!letter||busy} onClick=${regen}><${Icon} n="refresh" s=${15}/>Regenerate</button>
       <button className="btn btn-g" disabled=${!letter||busy} onClick=${()=>setEditing(!editing)}><${Icon} n=${editing?'check':'pencil'} s=${15}/>${editing?'Done':'Edit'}</button>
       <button className="btn btn-p" style=${{padding:'.55rem 1.2rem',fontSize:'.9rem'}} disabled=${!letter||busy||exp||editing} onClick=${save}><${Icon} n="download" s=${16}/>${exp?'Creating…':'Download as JPG'}</button>
      </div></div>
     ${busy?html`<div className="glass flex flex-col items-center justify-center text-center" style=${{minHeight:420,gap:14}}>
       <div className="beat" style=${{color:'var(--ac)'}}><${Icon} n="heart" s=${72} fill="currentColor"/></div>
       <div className="serif" style=${{fontSize:'1.2rem'}}>Writing your letter<span style=${{animation:'dot 1.2s infinite'}}>.</span><span style=${{animation:'dot 1.2s .2s infinite'}}>.</span><span style=${{animation:'dot 1.2s .4s infinite'}}>.</span></div></div>`
      :letter?html`<${LetterCard} cardRef=${card} lang=${tab} text=${text} editing=${editing} onText=${v=>setLetter({...letter,[tab]:v})} f=${f} photo=${photo} el=${el}/>`
      :html`<div className="glass flex flex-col items-center justify-center text-center p-8" style=${{minHeight:420,gap:12,borderStyle:'dashed'}}>
       <div className="beat" style=${{color:'var(--ac)',opacity:.6}}><${Icon} n="heart" s=${56}/></div>
       <div className="serif" style=${{fontSize:'1.25rem'}}>Your letter will appear here</div>
       <div style=${{color:'var(--mut)',maxWidth:340}}>Fill in your story and press “Generate”. You can edit the words, switch language and download a high-resolution JPG.</div></div>`}
    </div>
   </section>
  </main>

  <footer style=${{position:'relative',zIndex:1,borderTop:'1px solid var(--bd)',textAlign:'center',padding:'32px 16px 40px',color:'var(--mut)'}}>
   <div className="serif" style=${{fontStyle:'italic',fontSize:'1.1rem',marginBottom:10}}>“In all the world, there is no heart for me like yours.”</div>
   <div>Designed & Developed with ❤️ by ${PORTFOLIO_URL?html`<a href=${PORTFOLIO_URL} target="_blank" rel="noopener" style=${{color:'var(--ac)',fontWeight:600}}>Farhan Hassan</a>`:html`<span style=${{color:'var(--ac)',fontWeight:600}}>Farhan Hassan</span>`}</div>
  </footer>
  ${toast&&html`<div className="toast">${toast}</div>`}
 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
